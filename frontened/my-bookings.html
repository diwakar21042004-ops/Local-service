<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings | ProLocal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: var(--bg-alt);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: var(--nav-bg);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navbar .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-header {
            padding: 40px 20px;
            text-align: center;
            background: var(--bg-main);
            border-bottom: 1px solid var(--border-color);
        }

        .page-header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .bookings-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            flex-grow: 1;
        }

        .booking-card {
            background: var(--bg-main);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 15px;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.1);
            color: #16a34a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .booking-id {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .booking-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .detail-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .detail-item i {
            color: var(--primary-color);
            font-size: 1.1rem;
            margin-top: 3px;
        }

        .detail-text h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .detail-text p {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-main);
            border-radius: 20px;
            border: 1px dashed var(--border-color);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--border-color);
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--text-muted);
            margin-bottom: 25px;
        }

        .zomato-btn-primary {
            display: inline-block;
            background: var(--primary-color);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .zomato-btn-primary:hover {
            background: var(--primary-hover);
        }

        @media (max-width: 600px) {
            .booking-body {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            <i class="fa-solid fa-wrench"></i> ProLocal
        </a>
        <button id="darkModeToggle" style="background:transparent; border:none; color:var(--text-main); font-size:1.2rem; cursor:pointer;">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <div class="page-header">
        <h1>My Bookings</h1>
        <p>Track your upcoming and past service appointments</p>
    </div>

    <div class="bookings-container" id="bookingsContainer">
        <!-- Bookings will be dynamically injected here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Theme setup
            const toggleButton = document.getElementById('darkModeToggle');
            const toggleIcon = toggleButton.querySelector('i');
            const currentTheme = localStorage.getItem('theme') || 'light';
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                if(toggleIcon) toggleIcon.classList.replace('fa-moon', 'fa-sun');
            }
            if(toggleButton) {
                toggleButton.addEventListener('click', () => {
                    let theme = document.documentElement.getAttribute('data-theme');
                    if (theme === 'dark') {
                        document.documentElement.setAttribute('data-theme', 'light');
                        localStorage.setItem('theme', 'light');
                        toggleIcon.classList.replace('fa-sun', 'fa-moon');
                    } else {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        localStorage.setItem('theme', 'dark');
                        toggleIcon.classList.replace('fa-moon', 'fa-sun');
                    }
                });
            }

            // Load bookings
            const container = document.getElementById('bookingsContainer');
            const bookings = JSON.parse(localStorage.getItem('myBookings')) || [];

            if (bookings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-calendar-xmark"></i>
                        <h3>No bookings found</h3>
                        <p>You haven't booked any home services yet.</p>
                        <a href="index.html" class="zomato-btn-primary">Explore Services</a>
                    </div>
                `;
            } else {
                let html = '';
                bookings.forEach(bkg => {
                    html += `
                        <div class="booking-card">
                            <div class="booking-header">
                                <span class="booking-id">ID: ${bkg.id || 'BKG-0000'}</span>
                                <span class="status-badge"><i class="fa-solid fa-clock"></i> ${bkg.status || 'Upcoming'}</span>
                            </div>
                            <div class="booking-body">
                                <div class="detail-item">
                                    <i class="fa-solid fa-user-tie"></i>
                                    <div class="detail-text">
                                        <h4>Professional</h4>
                                        <p>${bkg.provider || 'Assigned Agent'}</p>
                                    </div>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-solid fa-screwdriver-wrench"></i>
                                    <div class="detail-text">
                                        <h4>Service Type</h4>
                                        <p>${bkg.service || 'General Service'}</p>
                                    </div>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-regular fa-calendar-check"></i>
                                    <div class="detail-text">
                                        <h4>Schedule</h4>
                                        <p>${bkg.date || 'TBD'} &bull; ${bkg.time || 'TBD'}</p>
                                    </div>
                                </div>
                                <div class="detail-item">
                                    <i class="fa-solid fa-location-dot"></i>
                                    <div class="detail-text">
                                        <h4>Address</h4>
                                        <p>${bkg.address || 'User Address'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        });
    </script>
</body>
</html>
